<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge - Freelancer Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">⚡ SkillBridge</h2>
        <div class="user-info">
            <div class="user-avatar">DR</div>
            <div class="user-details">
                <span class="label">Logged in as</span>
                <h3>diksha.rade24</h3>
                <span class="role">Client</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><button onclick="navigate('dashboard.html')"><i class="fas fa-chart-line"></i> Dashboard</button></li>
                <li><button onclick="navigate('analytics.html')"><i class="fas fa-chart-pie"></i> Analytics</button></li>
                <li><button onclick="navigate('job_listing.html')"><i class="fas fa-briefcase"></i> Job Listings</button></li>
                <li><button onclick="navigate('massages.html')"><i class="fas fa-comment-dots"></i> Messages</button></li>
                <li><button onclick="navigate('payments.html')"><i class="fas fa-wallet"></i> Payments</button></li>
                <li><button onclick="navigate('projects.html')"><i class="fas fa-user"></i> Projects</button></li>
                <li><button onclick="navigate('profile.html')"><i class="fas fa-user"></i> Profile</button></li>
            </ul>
        </nav>
        <div class="bottom-links">
            <button onclick="navigate('settings.html')"><i class="fas fa-gear"></i> Settings</button>
            <button onclick="navigate('help_Center.html')"><i class="fas fa-circle-question"></i> Help & Support</button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div>
                <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back to Proposals</button>
            </div>
        </div>
<div class="freelancer-profile-wrapper">

    <!-- Top Section -->
    <div class="freelancer-top-section">
        <div class="freelancer-avatar" id="freelancerAvatar"></div>

        <div class="freelancer-basic-info">
            <h2 id="freelancerName"></h2>
            <p id="freelancerRole"></p>
            <p id="freelancerEmail"></p>
        </div>
    </div>

    <!-- About -->
    <div class="freelancer-section">
        <h3>About</h3>
        <p id="freelancerAbout"></p>
    </div>

    <!-- Skills -->
    <div class="freelancer-section">
        <h3>Skills</h3>
        <div id="freelancerSkills" class="freelancer-skills"></div>
    </div>

    <!-- Experience -->
    <div class="freelancer-section">
        <h3>Experience</h3>
        <p id="freelancerExperience"></p>
    </div>

    <!-- Education -->
<div class="freelancer-section">
    <h3>Education</h3>
    <div id="freelancerEducation"></div>
</div>

<!-- Certifications -->
<div class="freelancer-section">
    <h3>Certifications</h3>
    <div id="freelancerCertifications"></div>
</div>

<!-- Languages -->
<div class="freelancer-section">
    <h3>Languages</h3>
    <div id="freelancerLanguages"></div>
</div>

<!-- Projects -->
<div class="freelancer-section">
    <h3>Total Projects</h3>
    <p id="freelancerProjects"></p>
</div>

<!-- Location -->
<div class="freelancer-section">
    <h3>Location</h3>
    <p id="freelancerLocation"></p>
</div>

   

</div>
    </main>
</div>

</body>
</html>
