<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSync - Freelancer Profile</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<div class="freelancer-profile-wrapper">

    <button class="back-btn" onclick="goBack()">← Back to Proposals</button>

    <!-- Top Section -->
    <div class="freelancer-top-section">
        <div class="freelancer-avatar" id="freelancerAvatar"></div>

        <div class="freelancer-basic-info">
            <h2 id="freelancerName"></h2>
            <p id="freelancerRole"></p>
            <p id="freelancerEmail"></p>
        </div>
    </div>

    <!-- About -->
    <div class="freelancer-section">
        <h3>About</h3>
        <p id="freelancerAbout"></p>
    </div>

    <!-- Skills -->
    <div class="freelancer-section">
        <h3>Skills</h3>
        <div id="freelancerSkills" class="freelancer-skills"></div>
    </div>

    <!-- Experience -->
    <div class="freelancer-section">
        <h3>Experience</h3>
        <p id="freelancerExperience"></p>
    </div>

    <!-- Education -->
<div class="freelancer-section">
    <h3>Education</h3>
    <div id="freelancerEducation"></div>
</div>

<!-- Certifications -->
<div class="freelancer-section">
    <h3>Certifications</h3>
    <div id="freelancerCertifications"></div>
</div>

<!-- Languages -->
<div class="freelancer-section">
    <h3>Languages</h3>
    <div id="freelancerLanguages"></div>
</div>

<!-- Projects -->
<div class="freelancer-section">
    <h3>Total Projects</h3>
    <p id="freelancerProjects"></p>
</div>

<!-- Location -->
<div class="freelancer-section">
    <h3>Location</h3>
    <p id="freelancerLocation"></p>
</div>

   

</div>

</body>
</html>
