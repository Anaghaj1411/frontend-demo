<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge - Job Listings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">⚡ SkillBridge</h2>
        <div class="user-info">
            <div class="user-avatar">DR</div>
            <div class="user-details">
                <span class="label">Logged in as</span>
                <h3>diksha.rade24</h3>
                <span class="role">Client</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><button onclick="navigate('dashboard.html')"><i class="fas fa-chart-line"></i> Dashboard</button></li>
                <li><button onclick="navigate('analytics.html')"><i class="fas fa-chart-pie"></i> Analytics</button></li>
                <li class="active"><button onclick="navigate('job_listing.html')"><i class="fas fa-briefcase"></i> Job Listings</button></li>
                <li><button onclick="navigate('massages.html')"><i class="fas fa-comment-dots"></i> Messages</button></li>
                <li><button onclick="navigate('payments.html')"><i class="fas fa-wallet"></i> Payments</button></li>
                <li><button onclick="navigate('projects.html')"><i class="fas fa-user"></i> Projects</button></li>
                <li><button onclick="navigate('profile.html')"><i class="fas fa-user"></i> Profile</button></li>
            </ul>
        </nav>
        <div class="bottom-links">
            <button onclick="navigate('settings.html')"><i class="fas fa-gear"></i> Settings</button>
            <button onclick="navigate('help_Center.html')"><i class="fas fa-circle-question"></i> Help & Support</button>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <h1>Job Listings</h1>
            <button class="primary-btn" onclick="navigate('create_job.html')">+ Post New Job</button>
        </div>

        <div id="jobContainer"></div>
    </main>
</div>
</body>
</html>
