<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge - Post New Job</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">⚡ SkillBridge</h2>
        <nav>
            <ul>
                <li><button onclick="navigate('dashboard.html')">Dashboard</button></li>
                <li><button onclick="navigate('job_listing.html')">Job Listings</button></li>
            </ul>
        </nav>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <h1>Post New Job</h1>
        </div>

        <div class="job-form-card">
            <form id="jobForm">
                <label>Job Title</label>
                <input type="text" id="title" placeholder="Full Stack Web Developer" required>

                <label>Budget Amount ($)</label>
                <input type="number" id="budget" placeholder="Enter amount" required>

                <label>Job Description</label>
                <textarea id="description" rows="5" placeholder="Describe the project..." required></textarea>

                <div class="form-actions">
                    <button type="button" class="secondary-btn" onclick="navigate('job_listing.html')">Cancel</button>
                    <button type="submit" class="primary-btn">Post Job</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
